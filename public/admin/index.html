<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Lights CMS</title>
    
    <!-- Added custom Christmas-themed styling for the CMS -->
    <style>
      :root {
        --christmas-navy: #0f172a;
        --christmas-blue: #1e3a5f;
        --christmas-gold: #fbbf24;
        --christmas-red: #dc2626;
        --christmas-green: #16a34a;
        --snow-white: #f8fafc;
      }

      body {
        background: linear-gradient(180deg, var(--christmas-navy) 0%, var(--christmas-blue) 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Starry night background effect */
      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(2px 2px at 20% 30%, white, transparent),
          radial-gradient(2px 2px at 60% 70%, white, transparent),
          radial-gradient(1px 1px at 50% 50%, white, transparent),
          radial-gradient(1px 1px at 80% 10%, white, transparent),
          radial-gradient(2px 2px at 90% 60%, white, transparent),
          radial-gradient(1px 1px at 33% 80%, white, transparent),
          radial-gradient(1px 1px at 65% 20%, white, transparent);
        background-size: 200% 200%;
        background-position: 0% 0%;
        animation: twinkle 3s ease-in-out infinite;
        pointer-events: none;
        opacity: 0.6;
        z-index: 0;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }

      /* Christmas header banner using ::before on #nc-root with proper positioning */
      #nc-root::before {
        content: '🎄 Christmas Lights Display Editor 🎄';
        display: block;
        background: linear-gradient(90deg, var(--christmas-red) 0%, var(--christmas-green) 50%, var(--christmas-red) 100%);
        color: white;
        text-align: center;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        margin-bottom: 0;
      }

      /* Add top padding to the main CMS container to prevent overlap */
      #nc-root > div {
        padding-top: 20px !important;
      }

      /* Main CMS container styling */
      [data-slate-editor="true"],
      .css-1qzevvg,
      .css-79elbk {
        background-color: rgba(15, 23, 42, 0.95) !important;
        backdrop-filter: blur(10px);
        color: var(--snow-white) !important;
      }

      /* Sidebar styling */
      aside,
      [class*="SidebarContainer"] {
        background-color: rgba(30, 58, 95, 0.95) !important;
        backdrop-filter: blur(10px);
        border-right: 2px solid var(--christmas-gold) !important;
      }

      /* Navigation and buttons */
      button,
      [role="button"] {
        background-color: var(--christmas-gold) !important;
        color: var(--christmas-navy) !important;
        border: none !important;
        border-radius: 6px !important;
        font-weight: 600 !important;
        transition: all 0.3s ease !important;
      }

      button:hover,
      [role="button"]:hover {
        background-color: var(--christmas-red) !important;
        color: white !important;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(251, 191, 36, 0.3) !important;
      }

      /* Input fields */
      input,
      textarea,
      select {
        background-color: rgba(248, 250, 252, 0.1) !important;
        border: 2px solid var(--christmas-gold) !important;
        color: var(--snow-white) !important;
        border-radius: 6px !important;
        padding: 8px !important;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--christmas-red) !important;
        outline: none !important;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2) !important;
      }

      /* Collection list items */
      li,
      [class*="CardLink"] {
        background-color: rgba(248, 250, 252, 0.1) !important;
        border: 1px solid var(--christmas-gold) !important;
        border-radius: 8px !important;
        margin-bottom: 10px !important;
        transition: all 0.3s ease !important;
      }

      li:hover,
      [class*="CardLink"]:hover {
        background-color: rgba(251, 191, 36, 0.2) !important;
        border-color: var(--christmas-red) !important;
        transform: translateX(5px);
      }

      /* Text and labels */
      label,
      span,
      p,
      h1, h2, h3, h4, h5, h6 {
        color: var(--snow-white) !important;
        font-weight: 600 !important;
      }

      /* Specific styling for field labels to ensure high contrast */
      label[for],
      [class*="FieldLabel"],
      [class*="field-label"] {
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 14px !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
        margin-bottom: 8px !important;
        display: block !important;
      }

      /* Enhanced visibility for gray text elements */
      [class*="FieldHint"],
      [class*="field-hint"],
      small {
        color: #e2e8f0 !important;
        font-weight: 500 !important;
      }

      /* Preview pane */
      iframe {
        border: 3px solid var(--christmas-gold) !important;
        border-radius: 8px !important;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3) !important;
      }

      /* Save button special styling */
      [class*="ToolbarButton"] {
        background: linear-gradient(135deg, var(--christmas-green) 0%, var(--christmas-red) 100%) !important;
        color: white !important;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
      }

      ::-webkit-scrollbar-track {
        background: var(--christmas-navy);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--christmas-gold);
        border-radius: 6px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--christmas-red);
      }

      /* Welcome message */
      [class*="AppHeader"] {
        background: rgba(30, 58, 95, 0.95) !important;
        border-bottom: 3px solid var(--christmas-gold) !important;
      }

      /* Added spacing below the Contents/Media tabs banner */
      [class*="ControlPaneContainer"],
      [class*="TabsContainer"] + div,
      [class*="EditorContainer"] {
        padding-top: 20px !important;
        margin-top: 20px !important;
      }
    </style>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
