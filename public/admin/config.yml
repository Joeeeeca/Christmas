backend:
  name: github
  repo: Joeeeeca/Christmas
  branch: main
  base_url: https://christmas-lights-cms.vercel.app
  auth_endpoint: /api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

editor:
  preview: false

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "hero"
        label: "Hero Section"
        file: "content/hero.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - { label: "Background Image", name: "backgroundImage", widget: "image" }

      - name: "about"
        label: "About Section"
        file: "content/about.json"
        fields:
          - { label: "Your Name", name: "name", widget: "string" }
          - { label: "Introduction", name: "introduction", widget: "text" }
          - { label: "Charity Name", name: "charityName", widget: "string" }
          - { label: "Why We Do This", name: "whyWeDoThis", widget: "text" }
          - { label: "Display Description", name: "displayDescription", widget: "text" }

      - name: "visit"
        label: "Visit Information"
        file: "content/visit.json"
        fields:
          - { label: "Display Times Image", name: "displayTimesImage", widget: "image" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Google Maps Embed URL", name: "mapEmbedUrl", widget: "string" }

      - name: "social"
        label: "Social & Donations"
        file: "content/social.json"
        fields:
          - { label: "JustGiving URL", name: "justGivingUrl", widget: "string" }
          - { label: "Facebook Page URL", name: "facebookUrl", widget: "string" }

  - name: "gallery"
    label: "Gallery Images"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }
