<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎄 Highfield Road CMS</title>
    <link rel="icon" href="/images/website-logo.jpg" />

    <style>
      /* 🌙 Base layout */
      body {
        background: linear-gradient(180deg, #0b1221 0%, #1b2b3b 100%);
        font-family: "Poppins", sans-serif;
        color: #fff;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      header {
        text-align: center;
        padding: 2rem 1rem 1rem;
      }

      header img {
        width: 100px;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      }

      header h1 {
        margin: 1rem 0 0.5rem;
        color: #e11d48;
      }

      header p {
        color: #cbd5e1;
        margin: 0;
      }

      /* 🎁 CMS Container */
      iframe {
        border: none;
        width: 100%;
        height: 100%;
        flex: 1;
        border-top: 2px solid rgba(255, 255, 255, 0.1);
        background-color: #0f172a;
      }

      /* ✨ Layout fixes for Decap inside the iframe */
      .nc-app,
      .nc-root,
      .nc-entryEditor,
      .nc-entryEditor-controlPane,
      .nc-entryEditor-previewPane {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }

      /* Buttons */
      button,
      .nc-button,
      .nc-toolbar-button {
        background-color: #e11d48 !important;
        color: #fff !important;
        border: none !important;
        border-radius: 8px !important;
        font-weight: 600 !important;
        transition: background 0.2s ease;
      }

      button:hover,
      .nc-button:hover,
      .nc-toolbar-button:hover {
        background-color: #22c55e !important;
      }

      /* Scrollbar style inside Decap */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <header>
      <img src="/images/website-logo.jpg" alt="Highfield Road Logo" />
      <h1>Highfield Road Christmas Lights</h1>
      <p>🎁 Manage your website content below 🎁</p>
    </header>

    <!-- 🧩 Load Decap CMS in an iframe for styling isolation -->
    <iframe src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.html"></iframe>
  </body>
</html>
