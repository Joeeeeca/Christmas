<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decap CMS</title>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      CMS.init({ config_path: "/admin/config.yml" });

      // 🎨 Wait for CMS to load and inject our custom CSS
      const customStyle = `
        body {
          background: linear-gradient(180deg, #0b1221 0%, #1b2b3b 100%);
          font-family: "Poppins", sans-serif !important;
          color: #fff !important;
        }

        .nc-appHeader,
        .nc-collectionPage-header {
          background: rgba(255, 255, 255, 0.05) !important;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
          backdrop-filter: blur(6px) !important;
        }

        .nc-collectionPage-entryCard {
          background: rgba(255, 255, 255, 0.05) !important;
          border-radius: 12px !important;
          padding: 10px !important;
          transition: 0.3s ease;
        }

        .nc-collectionPage-entryCard:hover {
          transform: translateY(-3px);
          box-shadow: 0 6px 12px rgba(255, 255, 255, 0.1);
        }

        input, textarea, select {
          background-color: #101c2d !important;
          color: #fff !important;
          border: 1px solid #334155 !important;
          border-radius: 8px !important;
          padding: 10px 12px !important;
          font-size: 15px !important;
          width: 100% !important;
        }

        input:focus, textarea:focus, select:focus {
          outline: none !important;
          border-color: #22c55e !important; /* green accent */
          box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.3) !important;
        }

        label, .nc-controlPane-label {
          font-weight: 600 !important;
          color: #ff5555 !important; /* red accent */
        }

        button, .nc-button, .nc-toolbar-button {
          background-color: #e11d48 !important;
          color: #fff !important;
          border-radius: 8px !important;
          font-weight: 600 !important;
          transition: background 0.2s ease;
        }

        button:hover, .nc-button:hover, .nc-toolbar-button:hover {
          background-color: #22c55e !important;
        }

        ::-webkit-scrollbar {
          width: 8px;
        }

        ::-webkit-scrollbar-thumb {
          background: #334155;
          border-radius: 4px;
        }
      `;

      const applyCustomStyles = () => {
        const iframe = document.querySelector("iframe#nc-root, iframe");
        if (!iframe || !iframe.contentDocument) {
          requestAnimationFrame(applyCustomStyles);
          return;
        }

        const doc = iframe.contentDocument;
        if (!doc.querySelector("#custom-decapskin")) {
          const style = doc.createElement("style");
          style.id = "custom-decapskin";
          style.innerHTML = customStyle;
          doc.head.appendChild(style);
        }
      };

      window.addEventListener("load", () => {
        // Try multiple times because Decap loads asynchronously
        for (let i = 0; i < 10; i++) {
          setTimeout(applyCustomStyles, i * 1000);
        }
      });
    </script>
  </body>
</html>
