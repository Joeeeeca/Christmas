<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🎄 Highfield Road CMS | Manage Website Content</title>

    <!-- 🖼️ Favicon -->
    <link rel="icon" href="/images/website-logo.jpg" />

    <!-- 🎨 Custom Styling -->
    <style>
      body {
        background: linear-gradient(180deg, #0b1221 0%, #1b2b3b 100%);
        font-family: 'Poppins', sans-serif;
        color: #fff;
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }

      h1 {
        font-size: 2rem;
        color: #ff2e2e;
        margin-bottom: 0.5rem;
      }

      .cms-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 1.5rem 0;
        z-index: 2;
        position: relative;
      }

      .cms-header img {
        width: 100px;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        margin-bottom: 1rem;
      }

      .cms-container {
        width: 100%;
        flex: 1;
        position: relative;
        z-index: 2;
      }

      /* ❄️ Snowfall background */
      .snow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .snowflake {
        position: absolute;
        top: -10px;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
        animation: fall linear infinite;
      }

      @keyframes fall {
        to {
          transform: translateY(100vh);
        }
      }

      /* Decap CMS overrides */
      .nc-app {
        background-color: transparent !important;
      }
    </style>
  </head>

  <body>
    <!-- ❄️ Snowflakes container -->
    <div class="snow" id="snow"></div>

    <div class="cms-header">
      <img src="/images/website-logo.jpg" alt="Highfield Road Logo" />
      <h1>Highfield Road Christmas Lights</h1>
      <p style="color:#e0e0e0;">🎁 Manage your website content below 🎁</p>
    </div>

    <!-- 🧩 Container for CMS -->
    <div id="nc-root" class="cms-container"></div>

    <!-- 🧠 Decap CMS Setup -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // ✅ Initialize Decap CMS
      window.CMS_MANUAL_INIT = true;
      window.addEventListener("load", function () {
        if (typeof CMS !== "undefined") {
          CMS.init({ config_path: "/admin/config.yml" });
        } else {
          console.error("❌ CMS failed to load.");
        }

        // ❄️ Create snowflakes
        const snowContainer = document.getElementById("snow");
        const numFlakes = 25;
        for (let i = 0; i < numFlakes; i++) {
          const flake = document.createElement("div");
          flake.classList.add("snowflake");
          const size = Math.random() * 6 + 2 + "px";
          flake.style.width = size;
          flake.style.height = size;
          flake.style.left = Math.random() * 100 + "%";
          flake.style.animationDuration = 5 + Math.random() * 5 + "s";
          flake.style.animationDelay = Math.random() * 5 + "s";
          snowContainer.appendChild(flake);
        }
      });
    </script>
  </body>
</html>
