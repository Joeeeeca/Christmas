backend:
  name: github
  repo: Joeeeeca/highfield-road-christmas-lights  # 👈 your GitHub repo
  branch: main                                    # or "master" if that's your default branch
  open_authoring: true
  base_url: https://decapcms-oauth.vercel.app
  auth_endpoint: /auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - name: "hero"
        label: "Hero Section"
        file: "src/content/hero.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Background Image", name: "backgroundImage", widget: "image" }
          - { label: "Button 1 Text", name: "button1Text", widget: "string" }
          - { label: "Button 1 Link", name: "button1Link", widget: "string" }
          - { label: "Button 2 Text", name: "button2Text", widget: "string" }
          - { label: "Button 2 Link", name: "button2Link", widget: "string" }
