backend:
  name: github
  repo: Joeeeeca/Christmas # your actual GitHub repo
  branch: main
  base_url: https://christmas-lights-cms.vercel.app # your actual Vercel URL
  auth_endpoint: /api/auth
  publish_mode: simple
  deploy_url: https://api.vercel.com/v1/integrations/deploy/prj_TlIB6bE2Ah8Pk5G4qYCq1fzjB1MO/gI6um08cbF

  site_url: https://highfieldroadlights.com

# ✅ Disable preview pane
editor:
  preview: false

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "sections"
    label: "Website Sections"
    files:
      # === HERO SECTION ===
      - file: "src/content/hero.json"
        label: "Hero Settings"
        name: "hero"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Title", name: "title", widget: "string", hint: "Main title shown on the homepage hero section" }
          - { label: "Text", name: "text", widget: "text", hint: "Short welcome message displayed below the headline" }
          - { label: "Background Image", name: "backgroundImage", widget: "image", hint: "Hero background photo" }
          - { label: "Button 1 Text", name: "button1Text", widget: "string", hint: "Label for the first button" }
          - { label: "Button 1 Link", name: "button1Link", widget: "string", hint: "Anchor link or URL for the first button" }
          - { label: "Button 2 Text", name: "button2Text", widget: "string", hint: "Label for the second button" }
          - { label: "Button 2 Link", name: "button2Link", widget: "string", hint: "Anchor link or URL for the second button" }

      # === ABOUT SECTION ===
      - file: "src/content/about.json"
        label: "About Section"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Icon", name: "icon", widget: "select", options: ["star", "gift", "sparkles"] }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

      # === GALLERY SECTION ===
      - file: "src/content/gallery.json"
        label: "Gallery Section"
        name: "gallery"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }

      # === VISIT SECTION ===
      - file: "src/content/visit.json"
        label: "Visit Section"
        name: "visit"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Visiting Hours Image", name: "visitingHoursImage", widget: "image" }
          - { label: "Map Embed URL", name: "mapEmbedUrl", widget: "string" }
          - { label: "Fallback Image", name: "fallbackImage", widget: "image" }

      # === DONATION SECTION ===
      - file: "src/content/donation.json"
        label: "Donation Section"
        name: "donation"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Donation Title", name: "donationTitle", widget: "string" }
          - { label: "Donation Text", name: "donationText", widget: "text" }
          - { label: "Donation URL", name: "donationUrl", widget: "string" }
          - { label: "Facebook URL", name: "facebookUrl", widget: "string" }
