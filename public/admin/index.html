<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Lights CMS</title>
    
    <!-- Added custom Christmas-themed styling for the CMS -->
    <style>
      :root {
        --christmas-navy: #0f172a;
        --christmas-blue: #1e3a5f;
        --christmas-gold: #fbbf24;
        --christmas-red: #dc2626;
        --christmas-green: #16a34a;
        --snow-white: #f8fafc;
      }

      body {
        background: linear-gradient(180deg, var(--christmas-navy) 0%, var(--christmas-blue) 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Starry night background effect */
      body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(2px 2px at 20% 30%, white, transparent),
          radial-gradient(2px 2px at 60% 70%, white, transparent),
          radial-gradient(1px 1px at 50% 50%, white, transparent),
          radial-gradient(1px 1px at 80% 10%, white, transparent),
          radial-gradient(2px 2px at 90% 60%, white, transparent),
          radial-gradient(1px 1px at 33% 80%, white, transparent),
          radial-gradient(1px 1px at 65% 20%, white, transparent);
        background-size: 200% 200%;
        background-position: 0% 0%;
        animation: twinkle 3s ease-in-out infinite;
        pointer-events: none;
        opacity: 0.6;
        z-index: 0;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.3; }
      }

      /* Christmas header banner using ::before on #nc-root with proper positioning */
      #nc-root::before {
        content: '🎄 Christmas Lights Display Editor 🎄';
        display: block;
        background: linear-gradient(90deg, var(--christmas-red) 0%, var(--christmas-green) 50%, var(--christmas-red) 100%);
        color: white;
        text-align: center;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        margin-bottom: 0;
      }

      /* Add top padding to the main CMS container to prevent overlap */
      #nc-root > div {
        padding-top: 20px !important;
        min-height: 100vh !important;
        height: 100% !important;
      }

      /* Main CMS container styling */
      [data-slate-editor="true"],
      .css-1qzevvg,
      .css-79elbk {
        background-color: rgba(15, 23, 42, 0.95) !important;
        backdrop-filter: blur(10px);
        color: var(--snow-white) !important;
      }

      /* Sidebar styling */
      aside,
      [class*="SidebarContainer"] {
        background-color: rgba(30, 58, 95, 0.95) !important;
        backdrop-filter: blur(10px);
        border-right: 2px solid var(--christmas-gold) !important;
      }

      /* Navigation and buttons */
      button,
      [role="button"] {
        background-color: var(--christmas-gold) !important;
        color: var(--christmas-navy) !important;
        border: none !important;
        border-radius: 6px !important;
        font-weight: 600 !important;
        transition: all 0.3s ease !important;
      }

      button:hover,
      [role="button"]:hover {
        background-color: var(--christmas-red) !important;
        color: white !important;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(251, 191, 36, 0.3) !important;
      }

      /* Input fields */
      input,
      textarea,
      select {
        background-color: rgba(248, 250, 252, 0.1) !important;
        border: 2px solid var(--christmas-gold) !important;
        color: var(--snow-white) !important;
        border-radius: 6px !important;
        padding: 8px !important;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--christmas-red) !important;
        outline: none !important;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2) !important;
      }

      /* Collection list items */
      li,
      [class*="CardLink"] {
        background-color: rgba(248, 250, 252, 0.1) !important;
        border: 1px solid var(--christmas-gold) !important;
        border-radius: 8px !important;
        margin-bottom: 10px !important;
        transition: all 0.3s ease !important;
      }

      li:hover,
      [class*="CardLink"]:hover {
        background-color: rgba(251, 191, 36, 0.2) !important;
        border-color: var(--christmas-red) !important;
        transform: translateX(5px);
      }

      /* Text and labels */
      label,
      span,
      p,
      h1, h2, h3, h4, h5, h6 {
        color: var(--snow-white) !important;
        font-weight: 600 !important;
      }

      /* Specific styling for field labels to ensure high contrast */
      label[for],
      [class*="FieldLabel"],
      [class*="field-label"] {
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 14px !important;
        text-transform: uppercase !important;
        letter-spacing: 0.5px !important;
        margin-bottom: 8px !important;
        display: block !important;
      }

      /* Enhanced visibility for gray text elements */
      [class*="FieldHint"],
      [class*="field-hint"],
      small {
        color: #e2e8f0 !important;
        font-weight: 500 !important;
      }

      /* Preview pane */
      iframe {
        border: 3px solid var(--christmas-gold) !important;
        border-radius: 8px !important;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3) !important;
      }

      /* Save button special styling */
      [class*="ToolbarButton"] {
        background: linear-gradient(135deg, var(--christmas-green) 0%, var(--christmas-red) 100%) !important;
        color: white !important;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 12px;
      }

      ::-webkit-scrollbar-track {
        background: var(--christmas-navy);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--christmas-gold);
        border-radius: 6px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--christmas-red);
      }

      /* Welcome message */
      [class*="AppHeader"] {
        background: rgba(30, 58, 95, 0.95) !important;
        border-bottom: 3px solid var(--christmas-gold) !important;
      }

      /* Added spacing below the Contents/Media tabs banner */
      [class*="ControlPaneContainer"],
      [class*="TabsContainer"] + div,
      [class*="EditorContainer"] {
        padding-top: 20px !important;
        margin-top: 20px !important;
      }

      /* Override Decap CMS preview pane background */
      [class*="StyledSplitPane"],
      [class*="splitPane"],
      [class*="card-splitPane"],
      .css-z43u28-StyledSplitPane-card-card-splitPane-splitPane {
        background: linear-gradient(180deg, var(--christmas-navy) 0%, var(--christmas-blue) 100%) !important;
        color: var(--snow-white) !important;
      }

      .css-83wr9v {
        background-color: transparent;
        border-color: var(--christmas-gold);
      }

      .css-y5bbau-AppHeaderContent,
      .css-8zenuf-AppHeader-css {
        display: none !important;
      }

      /* Push preview pane below header without adding extra overflow */
      #preview-pane {
        margin-top: 60px !important;
        display: block;
      }

      /* Align both panes without forcing overflow scrolling */
      #nc-root [class*="EditorControlPane"],
      #nc-root [class*="ControlPaneContainer"],
      #nc-root [class*="EditorContainer"] {
        margin-top: 60px !important;
      }

      /* Replace white split pane background with navy gradient */
      #nc-root [class*="StyledSplitPane"] {
        background: linear-gradient(180deg, var(--christmas-navy) 0%, var(--christmas-blue) 100%) !important;
      }

      /* Make preview background transparent */
      #nc-root [class*="PreviewPane"],
      #nc-root [class*="PaneContent"] {
        background: transparent !important;
      }

      /* Set proper height without forcing overflow on nested elements */
      #nc-root {
        min-height: 100vh !important;
        height: 100% !important;
      }

      /* Add padding for breathing room without overflow */
      #nc-root [class*="PreviewPaneContent"],
      #nc-root [class*="ControlPaneContainer"] {
        padding-bottom: 40px !important;
      }

      /* Override Decap CMS fixed heights and overflow to enable natural page scrolling */
      /* Remove fixed heights and overflow from split panes */
      [class*="StyledSplitPane"],
      [class*="splitPane"],
      [class*="Pane"],
      .Pane1,
      .Pane2 {
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        position: relative !important;
      }

      /* Allow editor and preview panes to flow naturally */
      [class*="EditorControlPane"],
      [class*="ControlPaneContainer"],
      [class*="PreviewPane"],
      [class*="PreviewPaneFrame"] {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        position: relative !important;
      }

      /* Remove overflow from parent containers */
      #nc-root,
      #nc-root > div,
      [class*="EditorContainer"],
      [class*="AppMainContainer"] {
        overflow: visible !important;
        height: auto !important;
      }

      /* Let the body handle all scrolling */
      html, body {
        overflow-x: hidden;
        overflow-y: auto;
        height: auto;
      }

      /* Ensure content doesn't have fixed positioning that breaks flow */
      [class*="EditorControl"],
      [class*="ControlPane"] {
        position: relative !important;
        overflow: visible !important;
      }

      /* Nuclear option - override all possible overflow and height properties */
      * {
        max-height: none !important;
      }

      /* Force the SplitPane component to not use fixed heights */
      .SplitPane {
        height: auto !important;
        position: relative !important;
      }

      .Resizer {
        display: none !important;
      }

      /* Target the specific preview pane iframe container to remove overflow */
      iframe[id*="preview"],
      [class*="PreviewPaneFrame"],
      [class*="PreviewPaneContent"],
      div[class*="preview"] {
        overflow: visible !important;
        height: auto !important;
        min-height: 100% !important;
        max-height: none !important;
      }

      /* Force all right-side pane elements to full height without scroll */
      .Pane2,
      .Pane.vertical.Pane2,
      div.Pane2 {
        overflow: visible !important;
        height: auto !important;
        min-height: 100vh !important;
        max-height: none !important;
      }

      /* Override inline styles that Decap adds dynamically */
      [class*="Pane"][style],
      [class*="Split"][style] {
        overflow: visible !important;
        height: auto !important;
      }

      /* Add extremely aggressive overrides for preview pane specifically */
      /* Target any div with Pane2 class or containing preview content */
      div[class*="Pane2"],
      div[class*="preview"],
      [data-testid*="preview"],
      .vertical.Pane2,
      div.Pane.vertical.Pane2,
      div[style*="overflow"] {
        overflow: visible !important;
        overflow-y: visible !important;
        height: auto !important;
        max-height: none !important;
        min-height: fit-content !important;
        flex: 1 1 auto !important;
      }

      /* Force flex containers to not constrain height */
      [class*="SplitPane"] > div,
      [class*="SplitPane"] > div > div {
        height: auto !important;
        overflow: visible !important;
        flex: 1 1 auto !important;
      }

      /* Override any computed flex or height styles */
      .Pane {
        flex-basis: auto !important;
        flex-grow: 1 !important;
        flex-shrink: 0 !important;
      }

      /* Make iframes and their containers respect content height */
      iframe,
      iframe[id*="preview"] {
        min-height: 100vh !important;
        height: auto !important;
      }
    </style>
