<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎄 Highfield Road CMS</title>
    <link rel="icon" href="/images/website-logo.jpg" />

    <style>
      body {
        background: linear-gradient(180deg, #0b1221 0%, #1b2b3b 100%);
        font-family: "Poppins", sans-serif;
        color: #fff;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header {
        text-align: center;
        padding: 2rem 1rem;
      }

      header img {
        width: 100px;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      }

      header h1 {
        margin-top: 1rem;
        color: #e11d48;
      }

      header p {
        color: #cbd5e1;
      }
    </style>
  </head>

  <body>
    <header>
      <img src="/images/website-logo.jpg" alt="Highfield Road Logo" />
      <h1>Highfield Road Christmas Lights</h1>
      <p>🎁 Manage your website content below 🎁</p>
    </header>

    <!-- Load Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
