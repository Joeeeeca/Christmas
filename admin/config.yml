backend:
  name: github
  repo: Joeeeeca/Christmas   # ✅ Correct format
  branch: main
  base_url: https://api.github.com
  auth_scope: repo
  open_authoring: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "sections"
    label: "Website Sections"
    files:
      - file: "src/content/hero.json"
        label: "Hero Section"
        name: "hero"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Background Image", name: "backgroundImage", widget: "image" }
          - { label: "Button 1 Text", name: "button1Text", widget: "string" }
          - { label: "Button 1 Link", name: "button1Link", widget: "string" }
          - { label: "Button 2 Text", name: "button2Text", widget: "string" }
          - { label: "Button 2 Link", name: "button2Link", widget: "string" }

      - file: "src/content/about.json"
        label: "About Section"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Icon", name: "icon", widget: "select", options: ["star", "gift", "sparkles"] }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

      - file: "src/content/gallery.json"
        label: "Gallery Section"
        name: "gallery"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }

      - file: "src/content/visit.json"
        label: "Visit Section"
        name: "visit"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Visiting Hours Image", name: "visitingHoursImage", widget: "image" }
          - { label: "Map Embed URL", name: "mapEmbedUrl", widget: "text" }
          - { label: "Fallback Image", name: "fallbackImage", widget: "image" }

      - file: "src/content/donation.json"
        label: "Donation & Social Section"
        name: "donation"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Donation Title", name: "donationTitle", widget: "string" }
          - { label: "Donation Text", name: "donationText", widget: "text" }
          - { label: "Donation URL", name: "donationUrl", widget: "string" }
          - { label: "Facebook URL", name: "facebookUrl", widget: "string" }
