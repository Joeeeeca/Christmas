backend:
  name: github
  repo: Joeeeeca/Christmas
  branch: main
  base_url: https://christmas-lights-cms.vercel.app
  auth_endpoint: /api/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

editor:
  preview: false

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "hero"
        label: "Hero Section"
        file: "content/hero.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Background Image", name: "backgroundImage", widget: "image" }
          - { label: "Button 1 Text", name: "button1Text", widget: "string" }
          - { label: "Button 1 Link", name: "button1Link", widget: "string" }
          - { label: "Button 2 Text", name: "button2Text", widget: "string" }
          - { label: "Button 2 Link", name: "button2Link", widget: "string" }

      - name: "about"
        label: "About Section"
        file: "content/about.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Icon", name: "icon", widget: "string", hint: "star, gift, or sparkles" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

      - name: "gallery"
        label: "Photo Gallery"
        file: "content/gallery.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }

      - name: "visit"
        label: "Visit Information"
        file: "content/visit.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Visiting Hours Image", name: "visitingHoursImage", widget: "image" }
          - { label: "Google Maps Embed URL", name: "mapEmbedUrl", widget: "string" }
          - { label: "Fallback Image", name: "fallbackImage", widget: "image" }

      - name: "donation"
        label: "Donations & Social"
        file: "content/donation.json"
        fields:
          - { label: "Section Title", name: "title", widget: "string" }
          - { label: "Donation Title", name: "donationTitle", widget: "string" }
          - { label: "Donation Text", name: "donationText", widget: "text" }
          - { label: "Donation URL", name: "donationUrl", widget: "string" }
          - { label: "Facebook Page URL", name: "facebookUrl", widget: "string" }

