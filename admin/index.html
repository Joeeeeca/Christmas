<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🎄 Highfield Road CMS | Manage Website Content</title>

    <!-- 🖼️ Favicon -->
    <link rel="icon" href="/images/website-logo.jpg" />

    <!-- 🎨 Custom Styling -->
    <style>
      body {
        background: linear-gradient(180deg, #0b1221 0%, #1b2b3b 100%);
        font-family: 'Poppins', sans-serif;
        color: #fff;
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      h1 {
        font-size: 2rem;
        color: #ff2e2e;
        margin-bottom: 0.5rem;
      }

      .cms-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2rem;
      }

      .cms-header img {
        width: 100px;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        margin-bottom: 1rem;
      }

      .cms-container {
        width: 100%;
        height: 100%;
      }

      /* Decap overrides */
      .nc-app {
        background-color: transparent !important;
      }
    </style>

    <!-- 🎅 Load Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>

  <body>
    <div class="cms-header">
      <img src="/images/website-logo.jpg" alt="Highfield Road Logo" />
      <h1>Highfield Road Christmas Lights</h1>
      <p style="color:#e0e0e0;">🎁 Manage your website content below 🎁</p>
    </div>

    <div class="cms-container"></div>

    <script>
      // Load the CMS config
      CMS.init({ config: '/admin/config.yml' });
    </script>
  </body>
</html>
