<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Highfield Road CMS 🎄</title>

    <!-- ✅ Load Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js" defer></script>

    <!-- 🌈 Custom Styling -->
    <style>
      body {
        background: linear-gradient(180deg, #0b1221 0%, #1b2b3b 100%);
        font-family: "Poppins", sans-serif;
        color: #fff;
        margin: 0;
        padding: 20px;
      }

      input, textarea, select {
        background-color: #101c2d !important;
        color: #fff !important;
        border: 1px solid #334155 !important;
        border-radius: 8px !important;
        padding: 10px 12px !important;
        font-size: 15px !important;
        width: 100%;
      }

      input:focus, textarea:focus, select:focus {
        outline: none !important;
        border-color: #22c55e !important;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.3) !important;
      }

      label, .nc-controlPane-label {
        font-weight: 600 !important;
        color: #e11d48 !important;
        margin-bottom: 6px !important;
      }

      .nc-controlPane {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      button, .nc-button, .nc-toolbar-button {
        background-color: #e11d48 !important;
        color: #fff !important;
        border: none !important;
        border-radius: 8px !important;
        font-weight: 600 !important;
        transition: background 0.2s ease;
      }

      button:hover, .nc-button:hover, .nc-toolbar-button:hover {
        background-color: #22c55e !important;
      }

      iframe {
        background-color: #0f172a;
        border-radius: 12px;
      }

      .nc-main-content {
        padding: 20px;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <script>
      // ✅ Wait until the CMS script has finished loading
      window.addEventListener("load", () => {
        if (window.CMS) {
          CMS.init({ config_path: "/admin/config.yml" });
          console.log("🎄 Decap CMS loaded successfully!");
        } else {
          console.error("⚠️ Decap CMS failed to load.");
        }
      });
    </script>
  </body>
</html>
