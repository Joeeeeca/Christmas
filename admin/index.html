<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎄 Christmas Lights CMS</title>
    <link rel="icon" href="/images/website-logo.jpg" />

    <!-- Christmas-themed CMS styling -->
    <style>
      :root {
        --christmas-navy: #0f172a;
        --christmas-blue: #1e3a5f;
        --christmas-gold: #fbbf24;
        --christmas-red: #dc2626;
        --christmas-green: #16a34a;
        --snow-white: #f8fafc;
      }

      body {
        background: linear-gradient(180deg, var(--christmas-navy) 0%, var(--christmas-blue) 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: var(--snow-white);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      /* Starry night */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(2px 2px at 20% 30%, white, transparent),
          radial-gradient(2px 2px at 60% 70%, white, transparent),
          radial-gradient(1px 1px at 50% 50%, white, transparent),
          radial-gradient(1px 1px at 80% 10%, white, transparent),
          radial-gradient(2px 2px at 90% 60%, white, transparent),
          radial-gradient(1px 1px at 33% 80%, white, transparent),
          radial-gradient(1px 1px at 65% 20%, white, transparent);
        background-size: 200% 200%;
        animation: twinkle 3s ease-in-out infinite;
        pointer-events: none;
        opacity: 0.5;
        z-index: 0;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.2; }
      }

      header {
        text-align: center;
        z-index: 2;
        padding: 1.5rem 1rem;
      }

      header img {
        width: 100px;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      }

      header h1 {
        margin: 0.75rem 0 0.25rem;
        color: var(--christmas-red);
      }

      header p {
        color: var(--snow-white);
        margin: 0;
      }

      /* CMS iframe (prevents overlap & layout bugs) */
      iframe {
        border: none;
        flex: 1;
        width: 100%;
        height: 100%;
        background-color: var(--christmas-navy);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/images/website-logo.jpg" alt="Highfield Road Logo" />
      <h1>Highfield Road Christmas Lights</h1>
      <p>🎁 Manage your website content below 🎁</p>
    </header>

    <!-- Decap CMS embedded safely -->
    <iframe src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.html"></iframe>
  </body>
</html>
