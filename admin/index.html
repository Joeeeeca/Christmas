<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Lights CMS</title>
    
    <!-- Added custom Christmas-themed styling for the CMS -->
   <style>
  :root {
    --christmas-navy: #111b2e;
    --christmas-blue: #1f3250;
    --christmas-gold: #fbbf24;
    --christmas-red: #e11d48;
    --christmas-green: #16a34a;
    --snow-white: #f9fafb;
    --frost-gray: #cbd5e1;
  }

  body {
    background: linear-gradient(180deg, var(--christmas-navy) 0%, var(--christmas-blue) 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    color: var(--snow-white);
  }

  /* Header banner */
  #nc-root::before {
    content: '🎄 Christmas Lights Display Editor 🎄';
    display: block;
    background: linear-gradient(90deg, var(--christmas-red), var(--christmas-green));
    color: white;
    text-align: center;
    padding: 18px 10px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  /* Sidebar and header */
  aside,
  [class*="SidebarContainer"],
  [class*="AppHeader"] {
    background-color: rgba(25, 45, 70, 0.95) !important;
    border-right: 2px solid var(--christmas-gold) !important;
    backdrop-filter: blur(8px);
  }

  [class*="AppHeader"] {
    border-bottom: 2px solid var(--christmas-gold) !important;
  }

  /* Form fields */
  label {
    color: var(--frost-gray) !important;
    font-weight: 600 !important;
    margin-bottom: 4px !important;
  }

  input,
  textarea,
  select {
    background-color: rgba(255, 255, 255, 0.08) !important;
    border: 1.5px solid var(--christmas-gold) !important;
    color: var(--snow-white) !important;
    border-radius: 6px !important;
    padding: 10px !important;
    margin-top: 4px !important;
  }

  input:focus,
  textarea:focus,
  select:focus {
    border-color: var(--christmas-red) !important;
    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.25) !important;
    outline: none;
  }

  /* Buttons */
  button,
  [role="button"] {
    background-color: var(--christmas-gold) !important;
    color: var(--christmas-navy) !important;
    border: none !important;
    border-radius: 6px !important;
    font-weight: 600 !important;
    transition: all 0.25s ease !important;
  }

  button:hover,
  [role="button"]:hover {
    background-color: var(--christmas-red) !important;
    color: white !important;
    transform: translateY(-1px);
  }

  /* Cards & collections */
  li,
  [class*="CardLink"] {
    background-color: rgba(255, 255, 255, 0.06) !important;
    border: 1px solid var(--christmas-gold) !important;
    border-radius: 8px !important;
    margin-bottom: 12px !important;
    transition: all 0.3s ease !important;
    padding: 6px !important;
  }

  li:hover,
  [class*="CardLink"]:hover {
    background-color: rgba(251, 191, 36, 0.15) !important;
    border-color: var(--christmas-red) !important;
    transform: translateX(4px);
  }

  /* Editor area */
  [data-slate-editor="true"],
  .css-1qzevvg,
  .css-79elbk {
    background-color: rgba(17, 27, 46, 0.95) !important;
    backdrop-filter: blur(10px);
    color: var(--snow-white) !important;
  }

  /* Scrollbar */
  ::-webkit-scrollbar {
    width: 10px;
  }
  ::-webkit-scrollbar-track {
    background: var(--christmas-navy);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--christmas-gold);
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--christmas-red);
  }

  /* Preview pane */
  iframe {
    border: 2px solid var(--christmas-gold) !important;
    border-radius: 8px !important;
    margin-top: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
  }
</style>

  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
